name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # No API key needed yet — the suite covers the deterministic parts
      # only. It will stay that way: the forecast and backtest must never
      # depend on a live LLM call to be checkable.
      - run: pytest tests/ -v
